<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMZ Prep — Pricing Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    :root {
      --bg:         #08080f;
      --bg2:        #0c0c18;
      --bg3:        #111120;
      --surface:    rgba(255,255,255,0.030);
      --surface2:   rgba(255,255,255,0.060);
      --border:     rgba(255,255,255,0.07);
      --border2:    rgba(255,255,255,0.13);
      --text:       #e8e8f2;
      --text2:      #8a8aaa;
      --text3:      #44445a;
      --violet:     #7c3aed;
      --violet-l:   #a78bfa;
      --violet-dim: rgba(124,58,237,0.12);
      --green:      #22c55e;  --green-dim:  rgba(34,197,94,0.10);
      --amber:      #f59e0b;  --amber-dim:  rgba(245,158,11,0.10);
      --red:        #f43f5e;  --red-dim:    rgba(244,63,94,0.10);
      --blue:       #60a5fa;  --blue-dim:   rgba(96,165,250,0.10);
      --sidebar-w:  68px;
      --topbar-h:   56px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* dot grid */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(circle, rgba(124,58,237,0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* ── SIDEBAR ──────────────────────────────────────────── */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center;
      padding: 16px 0;
      z-index: 200;
      gap: 4px;
    }

    .sidebar-logo {
      width: 36px; height: 36px; border-radius: 10px; overflow: hidden;
      margin-bottom: 20px; flex-shrink: 0;
    }
    .sidebar-logo img { width: 100%; height: 100%; object-fit: contain; }

    .sidebar-btn {
      width: 40px; height: 40px; border-radius: 10px;
      border: none; background: transparent;
      color: var(--text3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
      position: relative;
    }
    .sidebar-btn:hover { background: var(--surface2); color: var(--text2); }
    .sidebar-btn.active { background: var(--violet-dim); color: var(--violet-l); }
    .sidebar-btn svg { width: 18px; height: 18px; }

    .sidebar-sep {
      width: 28px; height: 1px; background: var(--border);
      margin: 6px 0;
    }

    .sidebar-bottom {
      margin-top: auto;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }

    /* tooltip on hover */
    .sidebar-btn[title]:hover::after {
      content: attr(title);
      position: absolute; left: calc(var(--sidebar-w) - 4px);
      background: var(--bg3); color: var(--text);
      font-size: 11px; font-family: 'Inter', sans-serif;
      white-space: nowrap; padding: 5px 10px; border-radius: 6px;
      border: 1px solid var(--border2);
      pointer-events: none; z-index: 300;
    }

    /* ── TOPBAR ───────────────────────────────────────────── */
    .topbar {
      position: fixed; top: 0; left: var(--sidebar-w); right: 0;
      height: var(--topbar-h);
      background: rgba(8,8,15,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      z-index: 150;
    }

    .topbar-left {
      display: flex; align-items: center; gap: 10px;
    }

    .topbar-title {
      font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
      color: var(--text);
    }

    .topbar-pill {
      font-size: 10px; font-family: 'DM Mono', monospace;
      padding: 2px 9px; border-radius: 999px;
      background: var(--violet-dim); color: var(--violet-l);
      border: 1px solid rgba(124,58,237,0.2);
      letter-spacing: 0.06em;
    }

    .topbar-right {
      display: flex; align-items: center; gap: 8px;
    }

    #refresh-indicator {
      font-size: 11px; font-family: 'DM Mono', monospace;
      color: var(--text3); letter-spacing: 0.02em;
    }

    .btn-sm {
      font-size: 12px; font-family: 'Inter', sans-serif; font-weight: 500;
      padding: 6px 14px; border-radius: 7px;
      border: 1px solid var(--border2);
      background: var(--surface); color: var(--text2);
      cursor: pointer; transition: all 0.15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-sm:hover { background: var(--surface2); color: var(--text); border-color: rgba(255,255,255,0.2); }

    .btn-sm.green {
      border-color: rgba(34,197,94,0.25);
      background: rgba(34,197,94,0.07); color: var(--green);
    }
    .btn-sm.green:hover { background: rgba(34,197,94,0.14); }

    .btn-sm.blue {
      border-color: rgba(96,165,250,0.25);
      background: rgba(96,165,250,0.07); color: var(--blue);
    }
    .btn-sm.blue:hover { background: rgba(96,165,250,0.14); }

    .user-info { display: flex; align-items: center; gap: 7px; }
    .user-avatar { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border2); }
    .user-name { font-size: 11px; color: var(--text2); font-family: 'DM Mono', monospace; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── MAIN CONTENT ─────────────────────────────────────── */
    .shell {
      margin-left: var(--sidebar-w);
      padding-top: var(--topbar-h);
      position: relative; z-index: 1;
    }

    .main { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

    .page-header { margin-bottom: 24px; }
    .page-title {
      font-size: 22px; font-weight: 700; letter-spacing: -0.03em; color: var(--text);
    }
    .page-sub {
      font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text3);
      margin-top: 4px; letter-spacing: 0.02em;
    }
    .page-sub span { color: var(--violet-l); }

    /* ── FILTERS ──────────────────────────────────────────── */
    .filters-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap;
    }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-label {
      font-size: 10px; font-family: 'DM Mono', monospace;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3);
    }
    .filter-input {
      font-size: 12px; font-family: 'Inter', sans-serif;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: rgba(255,255,255,0.025); color: var(--text);
      padding: 7px 10px;
      outline: none; min-width: 140px; transition: border-color 0.15s;
    }
    .filter-input:focus { border-color: rgba(124,58,237,0.5); }
    .filter-input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); }
    .filter-sep { font-size: 11px; color: var(--text3); padding-bottom: 9px; font-family: 'DM Mono', monospace; }
    .btn-clear-filters {
      font-size: 11px; padding: 7px 13px; border-radius: 7px;
      border: 1px solid var(--red-dim); background: var(--red-dim);
      color: var(--red); cursor: pointer; align-self: flex-end;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s;
    }
    .btn-clear-filters:hover { background: rgba(244,63,94,0.18); }
    .filter-active-badge {
      font-size: 10px; font-family: 'DM Mono', monospace;
      padding: 2px 7px; border-radius: 999px;
      background: var(--blue-dim); color: var(--blue);
      border: 1px solid rgba(96,165,250,0.2); margin-left: 6px;
    }

    /* ── STAT CARDS ───────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px; margin-bottom: 20px;
    }

    .stat-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .stat-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--card-accent, var(--violet)); opacity: 0.7;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.35); }

    .stat-card.primary { --card-accent: var(--blue); }
    .stat-card.success { --card-accent: var(--green); }
    .stat-card.warning { --card-accent: var(--amber); }
    .stat-card.danger  { --card-accent: var(--red); }

    .stat-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; margin-bottom: 12px;
    }
    .stat-card.primary .stat-icon { background: var(--blue-dim); }
    .stat-card.success .stat-icon { background: var(--green-dim); }
    .stat-card.warning .stat-icon { background: var(--amber-dim); }
    .stat-card.danger  .stat-icon { background: var(--red-dim); }

    .stat-label {
      font-size: 10px; font-family: 'DM Mono', monospace;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 6px;
    }
    .stat-value {
      font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1;
    }
    .stat-card.primary .stat-value { color: var(--blue); }
    .stat-card.success .stat-value { color: var(--green); }
    .stat-card.warning .stat-value { color: var(--amber); }
    .stat-card.danger  .stat-value { color: var(--red); }
    .stat-sub { font-size: 11px; color: var(--text3); margin-top: 5px; font-family: 'DM Mono', monospace; }
    .stat-delta {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 600; font-family: 'DM Mono', monospace;
      padding: 2px 7px; border-radius: 999px; margin-top: 8px;
    }
    .stat-delta.up   { background: var(--green-dim); color: var(--green); }
    .stat-delta.mid  { background: var(--amber-dim); color: var(--amber); }
    .stat-delta.down { background: var(--red-dim);   color: var(--red); }

    /* ── CHARTS ROW ───────────────────────────────────────── */
    .charts-row { display: grid; grid-template-columns: 1fr 280px; gap: 12px; margin-bottom: 20px; }

    .glass-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .card-title { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .card-badge {
      font-size: 10px; font-family: 'DM Mono', monospace; padding: 2px 8px;
      border-radius: 999px; background: var(--surface2); color: var(--text3);
      border: 1px solid var(--border);
    }

    .bar-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar-name { font-size: 12px; color: var(--text2); width: 110px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; height: 4px; background: rgba(255,255,255,0.04); border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 2px; transition: width 0.7s ease; }
    .bar-num { font-size: 11px; color: var(--text3); width: 36px; text-align: right; font-family: 'DM Mono', monospace; }

    .status-chart-wrap { display: flex; flex-direction: column; gap: 14px; }
    .donut-canvas { width: 130px !important; height: 130px !important; }
    .status-canvas { width: 100% !important; height: 340px !important; max-width: 100%; }
    .status-chart-legend { width: 100%; }
    .legend-row {
      display: flex; align-items: center; gap: 8px; font-size: 12px;
      color: var(--text2); margin-bottom: 6px; padding: 5px 7px;
      border-radius: 7px; transition: background 0.12s;
    }
    .legend-row:hover { background: var(--surface2); }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .legend-count { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; color: var(--text); }

    /* ── TAB BAR ──────────────────────────────────────────── */
    .tab-bar {
      display: flex; gap: 0; margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      font-size: 13px; font-family: 'Inter', sans-serif; font-weight: 500;
      padding: 10px 18px; border: none; background: transparent;
      color: var(--text3); cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: all 0.15s;
    }
    .tab-btn:hover { color: var(--text2); }
    .tab-btn.active { color: var(--violet-l); border-bottom-color: var(--violet); font-weight: 600; }

    /* ── STATUS FILTERS ───────────────────────────────────── */
    .status-filters { display: flex; gap: 5px; flex-wrap: wrap; }
    .sfil {
      font-size: 11px; font-family: 'DM Mono', monospace;
      padding: 4px 11px; border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent; color: var(--text3);
      cursor: pointer; transition: all 0.12s;
    }
    .sfil:hover { color: var(--text2); border-color: var(--border2); }
    .sfil.active { background: var(--violet); color: #fff; border-color: var(--violet); }

    /* ── TABLE ────────────────────────────────────────────── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    .table-topbar {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    .table-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead tr { background: rgba(255,255,255,0.015); }
    th {
      padding: 10px 14px; text-align: left;
      font-size: 10px; font-family: 'DM Mono', monospace;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3);
      border-bottom: 1px solid var(--border);
      cursor: pointer; user-select: none; white-space: nowrap; transition: color 0.12s;
    }
    th:hover { color: var(--text2); }
    th.sorted { color: var(--violet-l); }
    td { padding: 11px 14px; border-bottom: 1px solid rgba(255,255,255,0.035); vertical-align: middle; color: var(--text2); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.018); color: var(--text); }
    .td-client { font-weight: 600; color: var(--text); }
    .td-subject { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .td-mono { font-family: 'DM Mono', monospace; font-size: 11px; }

    .pill {
      display: inline-flex; align-items: center;
      font-size: 10px; font-family: 'DM Mono', monospace; font-weight: 600;
      padding: 2px 8px; border-radius: 999px; letter-spacing: 0.03em; white-space: nowrap;
    }
    .pill.on-time  { background: var(--green-dim);  color: var(--green);  border: 1px solid rgba(34,197,94,0.2); }
    .pill.delayed  { background: var(--amber-dim);  color: var(--amber);  border: 1px solid rgba(245,158,11,0.2); }
    .pill.overdue  { background: var(--red-dim);    color: var(--red);    border: 1px solid rgba(244,63,94,0.2); }
    .pill.pending  { background: var(--blue-dim);   color: var(--blue);   border: 1px solid rgba(96,165,250,0.2); }
    .pill.resolved { background: var(--violet-dim); color: var(--violet-l); border: 1px solid rgba(124,58,237,0.2); }

    /* ── REQUESTERS ───────────────────────────────────────── */
    .req-name-link {
      font-weight: 600; color: var(--text); cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: color 0.12s;
    }
    .req-name-link:hover { color: var(--violet-l); }
    .req-total { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 600; text-align: center; color: var(--blue); }
    .req-metric { font-family: 'DM Mono', monospace; font-size: 12px; text-align: center; }

    /* Detail view */
    .detail-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .btn-back {
      font-size: 12px; font-family: 'Inter', sans-serif; font-weight: 500;
      padding: 5px 12px; border-radius: 7px;
      border: 1px solid var(--border2); background: var(--surface2); color: var(--text2);
      cursor: pointer; transition: all 0.12s;
    }
    .btn-back:hover { color: var(--text); background: var(--surface2); }
    .detail-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .detail-count {
      font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text3);
      background: var(--surface2); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 999px; margin-left: auto;
    }

    /* ── EMPTY STATE ──────────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 56px 16px;
      color: var(--text3); font-family: 'DM Mono', monospace; font-size: 12px;
    }

    /* ── BLAIR TAB ────────────────────────────────────────── */
    .blair-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .blair-title { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
    .blair-sub { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text3); margin-top: 2px; }
    .blair-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .blair-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; text-align: center; }
    .blair-stat .bs-val { font-size: 22px; font-weight: 700; font-family: 'DM Mono', monospace; }
    .blair-stat .bs-lbl { font-size: 10px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-top: 4px; }
    @keyframes pulse-dot { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

    /* ── LOADING / ERROR ──────────────────────────────────── */
    .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 16px; gap: 14px; }
    .spinner { width: 32px; height: 32px; border: 2px solid rgba(255,255,255,0.04); border-top-color: var(--violet); border-radius: 50%; animation: spin 0.8s linear infinite; }
    .loading-txt { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text3); letter-spacing: 0.04em; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-banner { background: var(--red-dim); border: 1px solid rgba(244,63,94,0.2); border-radius: 9px; padding: 11px 14px; font-size: 12px; color: var(--red); margin-bottom: 16px; font-family: 'DM Mono', monospace; }

    /* ── LOGIN ────────────────────────────────────────────── */
    #login-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 18px; padding: 44px 40px;
      text-align: center; width: 90%; max-width: 380px;
    }
    .login-logo {
      width: 60px; height: 60px; border-radius: 14px; overflow: hidden;
      margin: 0 auto 20px; border: 1px solid var(--border2);
    }
    .login-logo img { width: 100%; height: 100%; object-fit: contain; }
    .login-title {
      font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px;
    }
    .login-sub { font-size: 12px; color: var(--text3); margin-bottom: 28px; font-family: 'DM Mono', monospace; }
    .btn-google {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 13px; font-family: 'Inter', sans-serif; font-weight: 600;
      padding: 11px 26px; border-radius: 10px; border: 1px solid var(--border2);
      background: var(--surface2); color: var(--text);
      cursor: pointer; transition: all 0.15s; width: 100%; justify-content: center;
    }
    .btn-google:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.2); }
    .btn-google svg { width: 18px; height: 18px; }
    .login-error { font-size: 11px; color: var(--red); margin-top: 12px; font-family: 'DM Mono', monospace; }
    .btn-signout {
      font-size: 11px; font-family: 'DM Mono', monospace; font-weight: 500;
      padding: 5px 11px; border-radius: 7px;
      border: 1px solid var(--border2);
      background: var(--surface); color: var(--text3);
      cursor: pointer; transition: all 0.15s;
    }
    .btn-signout:hover { color: var(--red); border-color: rgba(244,63,94,0.3); background: var(--red-dim); }

    @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2,1fr); } .charts-row { grid-template-columns: 1fr; } }

<script>
var SHEET_ID   = '13_1g-Iej0YNbR-6YY2rLoM3-R5uHWpfqdrSh2FLct44';
var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwj0cBbxCF3Pff0J_dvA4bnPG9KaEoykWyv7oCdW2R0GFa4NDZe07eZVP9shsnX5E4N/exec';
var REFRESH_MS = 5 * 60 * 1000;

// Single source of truth for all status colours — chart AND legend both read from here
var STATUS_COLORS = {
  'on-time':  '#22c55e',
  'delayed':  '#f59e0b',
  'overdue':  '#f43f5e',
  'pending':  '#60a5fa',
  'resolved': '#7c3aed'
};
var STATUS_LABELS = { 'on-time':'On Time','delayed':'Delayed','overdue':'Overdue','pending':'Pending','resolved':'Resolved' };

var allData = [], activeFilter = 'all', sortCol = 'received', sortDir = -1;
var statusChart = null, refreshTimer = null, countdownTimer = null, nextRefresh = null;
var searchClient = '', dateFrom = '', dateTo = '', activeTab = 'overview';
var requesterDetailName = null;

function showDashboard() {
  document.getElementById('app').innerHTML =
    '<div class="main">' +
      '<div class="page-header">' +
        '<div class="page-title">Pricing Request Intelligence</div>' +
        '<div class="page-sub">Automated SLA tracking · <span id="last-updated">Loading…</span></div>' +
      '</div>' +
      '<div id="error-container"></div>' +
      '<div id="content"><div class="loading-wrap"><div class="spinner"></div><div class="loading-txt">Syncing from Google Sheets…</div></div></div>' +
    '</div>';
}

async function loadData() {
  clearError();
  var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=Tracker';
  try {
    var res = await fetch(url);
    if (!res.ok) throw new Error('Cannot reach sheet (HTTP ' + res.status + '). Ensure the sheet is set to public view.');
    var csv = await res.text();
    if (csv.includes('<!DOCTYPE')) throw new Error('Sheet not found or not public.');
    var rows = parseCSV(csv);
    if (rows.length < 2) throw new Error('Sheet is empty — run backfillPricingRequests() first.');

    var col = {};
    rows[0].forEach(function(h, i) { col[h.replace(/"/g, '').trim()] = i; });

    allData = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      if (!r[col['Client']]) continue;

      var hrs = col['Response Time (hrs)'] !== undefined && r[col['Response Time (hrs)']] !== ''
        ? parseFloat(r[col['Response Time (hrs)']]) : null;
      var reopenHrs = col['Reopen Resolution Time (hrs)'] !== undefined && r[col['Reopen Resolution Time (hrs)']] !== ''
        ? parseFloat(r[col['Reopen Resolution Time (hrs)']]) : null;

      var raw = (r[col['Status']] || '').toLowerCase();
      var s = raw.indexOf('resolved') !== -1 ? 'resolved'
            : raw.indexOf('on time')  !== -1 ? 'on-time'
            : raw.indexOf('delayed')  !== -1 ? 'delayed'
            : raw.indexOf('overdue')  !== -1 ? 'overdue' : 'pending';

      allData.push({
        client:              r[col['Client']]     || '?',
        received:            r[col['Received']]   || '',
        subject:             r[col['Subject']]    || '',
        link:                r[col['Gmail Link']] || '',
        replied:             r[col['Replied At']] || null,
        responseHrs:         hrs,
        status:              s,
        resolvedAt:          r[col['Resolved At']]   || '',
        requestedBy:         r[col['Requested By']]  || '',
        reopenedAt:          col['Reopened At']     !== undefined ? (r[col['Reopened At']]                    || '') : '',
        reopenResolutionHrs: reopenHrs,
        blairInvolved:       col['Blair Involved']  !== undefined ? (r[col['Blair Involved']] || '').toUpperCase() === 'TRUE' : false
      });
    }
    render();
    scheduleRefresh();
  } catch(e) {
    showError(e.message);
    document.getElementById('content').innerHTML = '<div class="empty-state">' + e.message + '</div>';
  }
}

function scheduleRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  if (countdownTimer) clearInterval(countdownTimer);
  nextRefresh = Date.now() + REFRESH_MS;
  refreshTimer = setTimeout(loadData, REFRESH_MS);
  countdownTimer = setInterval(function() {
    var s = Math.max(0, Math.round((nextRefresh - Date.now()) / 1000));
    var el = document.getElementById('refresh-indicator');
    if (el) el.textContent = 'refreshes in ' + (s >= 60 ? Math.floor(s / 60) + 'm' : s + 's');
  }, 1000);
}

function manualRefresh() { loadData(); }

function getFiltered() {
  return allData.filter(function(d) {
    if (activeFilter !== 'all' && d.status !== activeFilter) return false;
    if (searchClient && d.client.toLowerCase().indexOf(searchClient.toLowerCase()) === -1) return false;
    if (dateFrom) { var rd = new Date(d.received), fd = new Date(dateFrom); if (!isNaN(rd) && !isNaN(fd) && rd < fd) return false; }
    if (dateTo)   { var rd2 = new Date(d.received), td = new Date(dateTo + 'T23:59:59'); if (!isNaN(rd2) && !isNaN(td) && rd2 > td) return false; }
    return true;
  });
}

function isFiltered() { return searchClient || dateFrom || dateTo; }

function clearFilters() {
  searchClient = ''; dateFrom = ''; dateTo = '';
  var sc = document.getElementById('sc'); if (sc) sc.value = '';
  var df = document.getElementById('df'); if (df) df.value = '';
  var dt = document.getElementById('dt'); if (dt) dt.value = '';
  render();
}

function render() {
  var fd      = getFiltered();
  var replied = fd.filter(function(d) { return d.responseHrs !== null; });
  var onTime  = fd.filter(function(d) { return d.status === 'on-time'; }).length;
  var delayed = fd.filter(function(d) { return d.status === 'delayed'; }).length;
  var overdue = fd.filter(function(d) { return d.status === 'overdue'; }).length;
  var pending = fd.filter(function(d) { return d.status === 'pending'; }).length;
  var resolved= fd.filter(function(d) { return d.status === 'resolved';}).length;
  var avgHrs  = replied.length ? Math.round(replied.reduce(function(s,d){return s+d.responseHrs;},0)/replied.length*10)/10 : 0;
  var slaRate = replied.length ? Math.round(onTime/replied.length*100) : 0;

  var allOT = allData.filter(function(d){return d.status==='on-time';}).length;
  var allDe = allData.filter(function(d){return d.status==='delayed';}).length;
  var allOv = allData.filter(function(d){return d.status==='overdue';}).length;
  var allPe = allData.filter(function(d){return d.status==='pending';}).length;
  var allRe = allData.filter(function(d){return d.status==='resolved';}).length;

  var barData = replied.slice().sort(function(a,b){return b.responseHrs-a.responseHrs;}).slice(0,7);
  var maxH = barData.length ? barData[0].responseHrs : 1;
  var bars = barData.map(function(d) {
    var pct = Math.round(d.responseHrs/maxH*100);
    return '<div class="bar-item"><div class="bar-name" title="'+esc(d.client)+'">'+esc(d.client)+'</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+STATUS_COLORS[d.status]+';"></div></div>' +
      '<div class="bar-num">'+d.responseHrs+'h</div></div>';
  }).join('');

  var totalStatus = onTime + delayed + overdue + pending + resolved;
  var legend = [
    ['On Time', onTime, 'on-time'], ['Delayed', delayed, 'delayed'],
    ['Overdue', overdue, 'overdue'], ['Pending', pending, 'pending'], ['Resolved', resolved, 'resolved']
  ].map(function(l) {
    var pct = totalStatus ? Math.round(l[1] / totalStatus * 100) : 0;
    return '<div class="legend-row">' +
      '<div class="legend-dot" style="background:'+STATUS_COLORS[l[2]]+'"></div>' +
      l[0] + ' <span class="legend-count">'+l[1]+' ('+pct+'%)</span></div>';
  }).join('');

  var filterBadge = isFiltered() ? '<span class="filter-active-badge">'+fd.length+' / '+allData.length+'</span>' : '';
  var slaClass = slaRate >= 80 ? 'up' : slaRate >= 50 ? 'mid' : 'down';

  document.getElementById('content').innerHTML =
    '<div class="filters-panel">' +
      '<div class="filter-group"><div class="filter-label">Search client</div>' +
        '<input class="filter-input" id="sc" type="text" placeholder="e.g. Dupray…" value="'+esc(searchClient)+'" oninput="searchClient=this.value;render();" /></div>' +
      '<div class="filter-group"><div class="filter-label">Received from</div>' +
        '<input class="filter-input" id="df" type="date" value="'+dateFrom+'" onchange="dateFrom=this.value;render();" /></div>' +
      '<div class="filter-sep">→</div>' +
      '<div class="filter-group"><div class="filter-label">Received to</div>' +
        '<input class="filter-input" id="dt" type="date" value="'+dateTo+'" onchange="dateTo=this.value;render();" /></div>' +
      (isFiltered() ? '<button class="btn-clear-filters" onclick="clearFilters()">✕ Clear</button>' : '') +
    '</div>' +

    '<div class="stats-grid">' +
      sCard('primary','📦','Total Requests', fd.length, isFiltered() ? allData.length+' total' : 'all time', null) +
      sCard('warning','⚡','Avg Response',   avgHrs+'h', isFiltered() ? 'filtered range' : 'replied emails', null) +
      sCard('success','🎯','SLA Rate',       slaRate+'%', isFiltered() ? 'filtered range' : '≤4h target', slaClass) +
      sCard('danger', '⏳','Pending',        pending,     'awaiting reply', pending > 0 ? 'mid' : null) +
    '</div>' +

    '<div style="margin-bottom: 20px;">' +
      '<div class="glass-card">' +
        '<div class="card-header"><div class="card-title">Status Breakdown</div></div>' +
        '<div class="status-chart-wrap"><canvas class="status-canvas" id="status-c"></canvas>' +
        '<div class="status-chart-legend">'+legend+'</div></div>' +
      '</div>' +
    '</div>' +

    '<div style="margin-bottom: 20px;">' +
      '<div class="glass-card">' +
        '<div class="card-header"><div class="card-title">Response Time by Client</div>' +
        '<div class="card-badge">'+(isFiltered()?'FILTERED':'ALL TIME')+'</div></div>' +
        (bars || '<div class="empty-state">No replied emails in range</div>') +
      '</div>' +
    '</div>' +

    '<div class="tab-bar">' +
      '<button class="tab-btn'+(activeTab==='overview'   ?' active':'')+'" onclick="switchTab(\'overview\')">All Requests'+filterBadge+'</button>' +
      '<button class="tab-btn'+(activeTab==='requesters' ?' active':'')+'" onclick="switchTab(\'requesters\')">By Requester</button>' +
      '<button class="tab-btn'+(activeTab==='blair'      ?' active':'')+'" onclick="switchTab(\'blair\')">Blair Forrest</button>' +
    '</div>' +

    '<div id="tab-overview"'   +(activeTab!=='overview'   ?' style="display:none"':'')+'>'+
      '<div class="table-wrap">'+
        '<div class="table-topbar">'+
          '<div class="table-title">Pricing Requests '+filterBadge+'</div>'+
          '<div class="status-filters">'+
            sfil('all',      'All ('+allData.length+')') +
            sfil('on-time',  '✓ On Time ('  +allOT+')') +
            sfil('delayed',  '⚠ Delayed ('  +allDe+')') +
            sfil('overdue',  '✕ Overdue ('  +allOv+')') +
            sfil('pending',  '○ Pending ('  +allPe+')') +
            sfil('resolved', '● Resolved ('+allRe+')') +
          '</div>'+
        '</div>'+
        '<div id="tbl-body"></div>'+
      '</div>'+
    '</div>' +

    '<div id="tab-requesters"'+(activeTab!=='requesters' ?' style="display:none"':'')+'>'+
      '<div id="req-body"></div>'+
    '</div>' +

    '<div id="tab-blair"'     +(activeTab!=='blair'      ?' style="display:none"':'')+'>'+
      '<div id="blair-body"></div>'+
    '</div>';

  var lu = document.getElementById('last-updated');
  if (lu) lu.innerHTML = 'Last synced <span>'+new Date().toLocaleTimeString()+'</span>';

  renderTable(fd);
  if (activeTab === 'requesters') renderRequesters(fd);
  if (activeTab === 'blair') renderBlairTab(fd);
  drawStatusChart(onTime, delayed, overdue, pending, resolved);
}

function sCard(type, icon, label, val, sub, delta) {
  var d = delta ? '<div class="stat-delta '+(delta==='up'?'up':delta==='mid'?'mid':'down')+'">'+(delta==='up'?'↑ HEALTHY':delta==='mid'?'⚠ WATCH':'↓ LOW')+'</div>' : '';
  return '<div class="stat-card '+type+'">' +
    '<div class="stat-icon">'+icon+'</div>' +
    '<div class="stat-label">'+label+'</div>' +
    '<div class="stat-value">'+val+'</div>' +
    '<div class="stat-sub">'+sub+'</div>'+d+
  '</div>';
}

function sfil(f, label) {
  return '<button class="sfil'+(activeFilter===f?' active':'')+'" onclick="setFilter(\''+f+'\')">'+label+'</button>';
}

function setFilter(f) { activeFilter = f; render(); }

function switchTab(t) {
  if (t !== 'requesters') requesterDetailName = null;
  activeTab = t;
  // sync sidebar icons
  document.querySelectorAll('.sidebar-btn[data-tab]').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === t);
  });
  // sync in-content tab buttons
  var ov = document.getElementById('tab-overview');
  var rq = document.getElementById('tab-requesters');
  var bl = document.getElementById('tab-blair');
  if (ov) ov.style.display = t === 'overview'   ? '' : 'none';
  if (rq) rq.style.display = t === 'requesters' ? '' : 'none';
  if (bl) bl.style.display = t === 'blair'       ? '' : 'none';
  document.querySelectorAll('.tab-btn').forEach(function(b, i) {
    b.classList.toggle('active', (i===0&&t==='overview')||(i===1&&t==='requesters')||(i===2&&t==='blair'));
  });
  if (t === 'requesters') renderRequesters(getFiltered());
  if (t === 'blair') renderBlairTab(getFiltered());
}

function renderTable(fd) {
  var sorted = fd.slice().sort(function(a, b) {
    var av = sortCol==='responseHrs'         ? (a.responseHrs!==null         ? a.responseHrs         : 999999)
           : sortCol==='reopenResolutionHrs' ? (a.reopenResolutionHrs!==null ? a.reopenResolutionHrs : 999999)
           : sortCol==='received'            ? new Date(a.received)
           : (a[sortCol]||'');
    var bv = sortCol==='responseHrs'         ? (b.responseHrs!==null         ? b.responseHrs         : 999999)
           : sortCol==='reopenResolutionHrs' ? (b.reopenResolutionHrs!==null ? b.reopenResolutionHrs : 999999)
           : sortCol==='received'            ? new Date(b.received)
           : (b[sortCol]||'');
    return av < bv ? sortDir : av > bv ? -sortDir : 0;
  });

  var si = function(c) { return sortCol===c ? (sortDir===-1?'↓':'↑') : '↕'; };
  var sc = function(c) { return sortCol===c ? 'sorted' : ''; };

  if (!sorted.length) {
    document.getElementById('tbl-body').innerHTML = '<div class="empty-state">No records match your filters</div>';
    return;
  }

// ── REQUESTER SUMMARY ─────────────────────────────────────
function renderRequesters(fd) {
  if (requesterDetailName !== null) { renderRequesterDetail(fd); return; }

  var map = {};
  fd.forEach(function(d) {
    var n = d.requestedBy || 'Unknown';
    if (!map[n]) map[n] = { name:n, total:0, replied:[], onTime:0, delayed:0, overdue:0, pending:0, resolved:0 };
    map[n].total++;
    if (d.responseHrs !== null) map[n].replied.push(d.responseHrs);
    if (d.status==='on-time')  map[n].onTime++;
    if (d.status==='delayed')  map[n].delayed++;
    if (d.status==='overdue')  map[n].overdue++;
    if (d.status==='pending')  map[n].pending++;
    if (d.status==='resolved') map[n].resolved++;
  });
  var rows = Object.values(map).sort(function(a,b){return b.total-a.total;});
  if (!rows.length) { document.getElementById('req-body').innerHTML = '<div class="empty-state">No data</div>'; return; }

  var trows = rows.map(function(r) {
    var avg     = r.replied.length ? Math.round(r.replied.reduce(function(s,v){return s+v;},0)/r.replied.length*10)/10 : null;
    var sla     = r.replied.length ? Math.round(r.onTime/r.replied.length*100) : null;
    var fastest = r.replied.length ? Math.min.apply(null,r.replied) : null;
    var slowest = r.replied.length ? Math.max.apply(null,r.replied) : null;
    var slaCol  = sla!=null ? (sla>=80?'var(--green)':sla>=50?'var(--amber)':'var(--red)') : 'var(--text3)';
    var breakdown = [
      r.onTime   ? '<span style="color:var(--green);font-size:11px;">'    +r.onTime  +' on time</span>'  : '',
      r.delayed  ? '<span style="color:var(--amber);font-size:11px;">'    +r.delayed +' delayed</span>'  : '',
      r.overdue  ? '<span style="color:var(--red);font-size:11px;">'      +r.overdue +' overdue</span>'  : '',
      r.pending  ? '<span style="color:var(--blue);font-size:11px;">'     +r.pending +' pending</span>'  : '',
      r.resolved ? '<span style="color:var(--violet-l);font-size:11px;">'+r.resolved+' resolved</span>' : ''
    ].filter(Boolean).join('<span style="color:var(--text3);margin:0 4px;">·</span>');
    return '<tr>' +
      '<td><span class="req-name-link" data-requester="'+esc(r.name)+'">'+esc(r.name)+
        ' <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span></td>' +
      '<td class="req-total">'+r.total+'</td>' +
      '<td class="req-metric">'+(avg!=null?avg+'h':'—')+'</td>' +
      '<td class="req-metric" style="color:var(--green);">'   +(fastest!=null?fastest+'h':'—')+'</td>' +
      '<td class="req-metric" style="color:var(--red);">'     +(slowest!=null?slowest+'h':'—')+'</td>' +
      '<td class="req-metric" style="color:'+slaCol+';font-weight:700;">'+(sla!=null?sla+'%':'—')+'</td>' +
      '<td style="font-size:12px;">'+breakdown+'</td>' +
    '</tr>';
  }).join('');

  document.getElementById('req-body').innerHTML =
    '<div class="table-wrap">' +
      '<div class="table-topbar">' +
        '<div class="table-title">Requests by Sender'+(isFiltered()?'<span class="filter-active-badge">Filtered</span>':'')+'</div>' +
      '</div>' +
      '<table><thead><tr>' +
        '<th>Requested by</th><th style="text-align:center;">Total</th>' +
        '<th style="text-align:center;">Avg response</th><th style="text-align:center;">Fastest</th>' +
        '<th style="text-align:center;">Slowest</th><th style="text-align:center;">SLA rate</th><th>Breakdown</th>' +
      '</tr></thead><tbody>'+trows+'</tbody></table></div>';
  document.querySelectorAll('#req-body .req-name-link').forEach(function(el) {
    el.addEventListener('click', function() {
      showRequesterDetail(this.dataset.requester);
    });
  });
}

// ── REQUESTER DETAIL ──────────────────────────────────────
function showRequesterDetail(name) {
  requesterDetailName = name;
  renderRequesterDetail(getFiltered());
}

function hideRequesterDetail() {
  requesterDetailName = null;
  renderRequesters(getFiltered());
}

function renderRequesterDetail(fd) {
  var name   = requesterDetailName;
  var emails = fd.filter(function(d){ return (d.requestedBy||'Unknown') === name; });
  var noEmails = !emails.length;
  if (noEmails) {
    console.warn('No requests found for requester:', name, '(filtered request count:', fd.length + ')');
  }
  var statusOrder = { pending:0, overdue:1, delayed:2, 'on-time':3, resolved:4 };
  emails.sort(function(a,b) {
    var ao = statusOrder[a.status]!==undefined ? statusOrder[a.status] : 5;
    var bo = statusOrder[b.status]!==undefined ? statusOrder[b.status] : 5;
    return ao!==bo ? ao-bo : new Date(b.received)-new Date(a.received);
  });

  var rows = emails.map(function(d) {
    var recv  = d.received ? new Date(d.received).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}) : '—';
    var subj  = d.subject.replace(/^re:\s*/i,'');
    var subjEl = d.link
      ? '<a href="'+esc(d.link)+'" target="_blank" style="color:var(--text2);text-decoration:none;">'+esc(subj)+'</a>'
      : esc(subj);
    return '<tr>' +
      '<td class="td-subject">'+subjEl+'</td>' +
      '<td class="td-client">'+esc(d.client)+'</td>' +
      '<td class="td-mono" style="white-space:nowrap;">'+recv+'</td>' +
      '<td class="td-mono">'+(d.responseHrs!==null?d.responseHrs+'h':'—')+'</td>' +
      '<td><span class="pill '+d.status+'">'+STATUS_LABELS[d.status]+'</span></td>' +
    '</tr>';
  }).join('');

  document.getElementById('req-body').innerHTML =
    '<div class="table-wrap">' +
      '<div class="detail-header">' +
        '<button class="btn-back" onclick="hideRequesterDetail()">← Back</button>' +
        '<span class="detail-name">'+esc(name)+'</span>' +
        '<span class="detail-count">'+emails.length+' requests</span>' +
      '</div>' +
      (noEmails
        ? '<div class="empty-state">No requests found for this sender. Try clearing filters or switch to another tab.</div>'
        : '<table><thead><tr>' +
            '<th>Subject</th><th>Client</th><th>Received</th><th>1st Response</th><th>Status</th>' +
          '</tr></thead><tbody>'+rows+'</tbody></table>') +
    '</div>';
}

function sortBy(col) {
  if (sortCol===col) sortDir=-sortDir; else { sortCol=col; sortDir=-1; }
  renderTable(getFiltered());
}

// drawDonut reads directly from STATUS_COLORS — chart & legend always match
function drawStatusChart(onTime, delayed, overdue, pending, resolved) {
  setTimeout(function() {
    var canvas = document.getElementById('status-c'); if (!canvas) return;
    var parent = canvas.parentElement;
    if (parent) {
      var dpr = window.devicePixelRatio || 1;
      var rect = parent.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = 340 * dpr;
      canvas.style.width = '100%';
      canvas.style.height = '340px';
    }
    var ctx = canvas.getContext('2d'); if (!ctx) return;
    if (statusChart) { statusChart.destroy(); statusChart=null; }
    statusChart = new Chart(ctx, {
      type: 'bar',
      data: { labels: ['On Time','Delayed','Overdue','Pending','Resolved'], datasets: [{
        data: [onTime, delayed, overdue, pending, resolved],
        backgroundColor: [
          STATUS_COLORS['on-time'],
          STATUS_COLORS['delayed'],
          STATUS_COLORS['overdue'],
          STATUS_COLORS['pending'],
          STATUS_COLORS['resolved']
        ],
        borderWidth: 0,
        borderRadius: 6,
        barThickness: 42
      }] },
      options: {
        indexAxis: 'y',
        scales: {
          x: { beginAtZero: true, ticks: { color: 'rgba(226,232,240,0.85)', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.06)' } },
          y: { ticks: { color: 'rgba(226,232,240,0.85)', font: { size: 13 } }, grid: { display: false } }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                var value = context.parsed.x;
                var total = context.chart.data.datasets[0].data.reduce(function(sum,v){return sum+v;},0);
                var pct = total ? Math.round(value / total * 100) : 0;
                return context.label + ': ' + value + ' (' + pct + '%)';
              }
            }
          }
        },
        animation: { duration: 700, easing: 'easeInOutQuart' },
        maintainAspectRatio: false,
        responsive: true,
        layout: { padding: { top: 8, right: 16, left: 100, bottom: 8 } },
        plugins: [{
          id: 'statusBarLabels',
          afterDatasetsDraw: function(chart) {
            var ctx = chart.ctx;
            var dataset = chart.data.datasets[0];
            var total = dataset.data.reduce(function(sum,v){return sum+v;},0);
            ctx.save();
            ctx.fillStyle = '#e2e8f0';
            ctx.font = '13px Inter, system-ui, sans-serif';
            chart.getDatasetMeta(0).data.forEach(function(bar, index) {
              var value = dataset.data[index];
              var percent = total ? Math.round(value / total * 100) : 0;
              var label = value + ' (' + percent + '%)';
              var x = bar.x + 8;
              var y = bar.y;
              var textWidth = ctx.measureText(label).width;
              if (x + textWidth > chart.chartArea.right - 8) {
                x = bar.x - 8;
                ctx.textAlign = 'right';
              } else {
                ctx.textAlign = 'left';
              }
              ctx.textBaseline = 'middle';
              ctx.fillText(label, x, y);
            });
            ctx.restore();
          }
        }]
      }
    });
  }, 80);
}

function parseCSV(text) {
  var rows = [], lines = text.split('\n');
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim(); if (!line) continue;
    var cols=[], cur='', inQ=false;
    for (var j=0; j<line.length; j++) {
      var ch=line[j];
      if (ch==='"') inQ=!inQ;
      else if (ch===',' && !inQ) { cols.push(cur.trim()); cur=''; }
      else cur+=ch;
    }
    cols.push(cur.trim()); rows.push(cols);
  }
  return rows;
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

      '<div class="blair-stat"><div class="bs-val" style="color:var(--blue);">'+blairData.length+'</div><div class="bs-lbl">Total Emails</div></div>' +
      '<div class="blair-stat"><div class="bs-val" style="color:var(--amber);">'+avgHrs+'h</div><div class="bs-lbl">Avg Response</div></div>' +
      '<div class="blair-stat"><div class="bs-val" style="color:var(--red);">'+(pending+overdue)+'</div><div class="bs-lbl">Pending / Overdue</div></div>' +
    '</div>';

  if (!blairData.length) {
    html+='<div class="table-wrap"><div class="empty-state">No emails found involving Blair Forrest</div></div>';
  } else {
    var sorted=blairData.slice().sort(function(a,b){return new Date(b.received)-new Date(a.received);});
    var rows=sorted.map(function(d) {
      var recv=d.received?new Date(d.received).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}):'—';
      var subj=d.subject.replace(/^re:\s*/i,'');
      var subjEl=d.link?'<a href="'+esc(d.link)+'" target="_blank" style="color:var(--text2);text-decoration:none;">'+esc(subj)+'</a>':esc(subj);
      return '<tr>' +
        '<td class="td-client">'+esc(d.client)+'</td>' +
        '<td class="td-subject">'+subjEl+'</td>' +
        '<td class="td-mono" style="white-space:nowrap;">'+recv+'</td>' +
        '<td class="td-mono">'+(d.responseHrs!==null?d.responseHrs+'h':'—')+'</td>' +
        '<td><span class="pill '+d.status+'">'+STATUS_LABELS[d.status]+'</span></td>' +
        '<td class="td-mono" style="font-size:11px;">'+(d.requestedBy?esc(d.requestedBy):'—')+'</td>' +
      '</tr>';
    }).join('');
    html+='<div class="table-wrap">' +
      '<div class="table-topbar"><div class="table-title">Emails Involving Blair Forrest <span class="filter-active-badge">'+blairData.length+'</span></div></div>' +
      '<table><thead><tr><th>Client</th><th>Subject</th><th>Received</th><th>Response</th><th>Status</th><th>Requested by</th></tr></thead>' +
      '<tbody>'+rows+'</tbody></table></div>';
  }
  document.getElementById('blair-body').innerHTML = html;
}
</script>
</body>
</html>
